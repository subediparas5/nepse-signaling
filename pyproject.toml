[project]
name = "nepse-signaling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nepse-data-api>=1.0",
    "openai>=1.63.2",
    "pandas>=3.0.6",
    "requests>=2.32.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# Floors for transitive dependencies with published advisories (Dependabot alerts #1-#19).
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "idna>=3.15",
    "urllib3>=2.7.0",
]
